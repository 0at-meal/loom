# ==============================================================================
# Loom Phase 5 Local Infrastructure: Redis Service
# ==============================================================================
# Spins up Redis 7 with AOF persistence and automated container healthcheck.
# Usage:
#   docker compose up -d
#   docker compose ps
#   docker compose down
# ==============================================================================
version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: loom-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
