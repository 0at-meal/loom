[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom"
version = "0.1.0"
description = "Dynamic payment routing layer using Thompson Sampling and PID control"
readme = "docs/prd.md"
requires-python = ">=3.11"
authors = [{ name = "Loom Team" }]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "redis>=5.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "fakeredis[json]>=2.22.0",
    "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["router_core*", "acquirer_sim*", "data_layer*", "baseline_router*"]

# -----------------------------------------------------------------------------
# Code Guardrails: Ruff Linter & Formatter
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "dashboard",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except (NO bare except statements, mandated by Constitution)
    "UP",    # pyupgrade (modern Python 3.11 idioms)
    "RUF",   # Ruff-specific rules
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
# Type Safety: Mypy Configuration
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "fakeredis.*",
]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# Testing Harness: Pytest Configuration
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --tb=short"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
